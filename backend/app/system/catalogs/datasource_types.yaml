# 业务库类型目录（唯一真相源）。selectable=true 且 connector 已注册才可写入/校验。
types:
  - code: mysql
    name: MySQL
    group: oltp
    status: ga
    selectable: true
    color: "#00758F"
    defaultPort: 3306
    versionHint: "5.6+"
    dialect: mysql
    sqlglotRead: mysql
    connector: connectors.mysql
    formSchema:
      - { key: name, label: 名称, type: text, required: true }
      - { key: description, label: 描述, type: textarea, required: false, maxLength: 200 }
      - { key: host, label: 主机名/IP地址, type: text, required: true }
      - { key: port, label: 端口, type: number, required: true }
      - { key: username, label: 用户名, type: text, required: true }
      - { key: password, label: 密码, type: password, required: false }
      - { key: databaseName, label: 数据库, type: text, required: true }

